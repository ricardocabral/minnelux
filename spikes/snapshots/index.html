<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minnelux snapshot benchmark</title>
</head>
<body>
  <h1>Minnelux snapshot benchmark</h1>
  <button id="run" type="button">Run benchmark</button>
  <pre id="result" role="status">Ready</pre>
  <script type="module">
    const button = document.querySelector("#run");
    const result = document.querySelector("#result");
    const parameters = new URLSearchParams(location.search);
    button.addEventListener("click", () => {
      button.disabled = true;
      result.textContent = "Preparing synthetic catalog";
      const worker = new Worker("./benchmark.js", { type: "module" });
      const finish = (state, output) => {
        result.dataset.state = state;
        result.textContent = output;
        button.disabled = false;
        worker.terminate();
      };
      worker.addEventListener("message", ({ data }) => {
        if (data.result) finish("done", JSON.stringify(data.result, null, 2));
        else if (data.error) finish("error", data.error);
        else result.textContent = data.progress;
      });
      worker.addEventListener("error", ({ message }) => finish("error", message));
      delete result.dataset.state;
      worker.postMessage({
        runs: Number(parameters.get("runs") ?? 20),
        profile: parameters.get("profile") ?? "baseline",
      });
    });
    if (parameters.has("auto")) button.click();
  </script>
</body>
</html>
